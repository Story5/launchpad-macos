name: LaunchPadReplica
options:
  bundleIdPrefix: com.story5.launchpad
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CLANG_ENABLE_MODULES: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  LaunchPad:
    type: application
    platform: macOS
    sources:
      - path: LaunchPad
        excludes:
          - "**/Info.plist"
          - "Resources/**"
      - path: LaunchPad/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.story5.launchpad
        PRODUCT_NAME: LaunchPad
        # 版本号唯一来源：Info.plist 里用 $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) 引用，
        # 改版本只需改这里（不要在 Info.plist 里再硬编码一份）
        MARKETING_VERSION: "0.0.6"
        CURRENT_PROJECT_VERSION: "6"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: LaunchPad/Info.plist
      properties:
        CFBundleDisplayName: LaunchPad
        CFBundleName: LaunchPad
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: "YES"
        NSSupportsAutomaticTermination: "YES"
        NSHumanReadableCopyright: "LaunchPad replica for macOS"
        # 版本号唯一来源就在这里：xcodegen 会在 generate 时把它们注入 LaunchPad/Info.plist。
        # 注意不要在 Info.plist 里写 $(MARKETING_VERSION) —— xcodegen 会按自己的默认值
        # 提前展开成 1.0，导致改 version 不生效。
        CFBundleShortVersionString: "0.0.6"
        CFBundleVersion: "6"
    schemes:
      LaunchPad:
        build:
          targets:
            LaunchPad: all
        run:
          customLLDBInitFile: ""
